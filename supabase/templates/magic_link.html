<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>
<body style="margin:0;padding:32px 16px;background:#f1f5f9;font-family:system-ui,-apple-system,sans-serif;">
  <div style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:12px;padding:40px 32px;box-shadow:0 1px 4px rgba(0,0,0,0.08);">

    <!-- Logo -->
    <div style="text-align:center;margin-bottom:32px;">
      <div style="display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;background:#1e40af;border-radius:12px;margin-bottom:12px;">
        <span style="color:#ffffff;font-size:22px;font-weight:700;">S</span>
      </div>
      <h1 style="margin:0;font-size:18px;font-weight:700;color:#1e293b;">ShuleConnect</h1>
      <p style="margin:2px 0 0;font-size:13px;color:#64748b;">Elohim Education Centre</p>
    </div>

    <!-- Body -->
    <p style="margin:0 0 8px;font-size:15px;color:#374151;">Your login code:</p>

    <div style="text-align:center;margin:28px 0 24px;">
      <span style="display:inline-block;font-size:44px;font-weight:800;letter-spacing:14px;color:#1e40af;font-family:'Courier New',Courier,monospace;padding:16px 24px;background:#eff6ff;border-radius:10px;border:2px solid #bfdbfe;">{{ .Token }}</span>
    </div>

    <p style="margin:0 0 24px;font-size:13px;color:#6b7280;text-align:center;">
      Enter this 6-digit code on the login screen.<br/>
      It expires in <strong>60 minutes</strong> and can only be used once.
    </p>

    <hr style="border:none;border-top:1px solid #e5e7eb;margin:0 0 20px;" />

    <p style="margin:0;font-size:12px;color:#9ca3af;text-align:center;">
      If you did not request this code, ignore this email — your account is safe.
    </p>
  </div>
</body>
</html>
